---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: learn-helm
  namespace: flux-system
spec:
  image: ghcr.io/ivankuchin/test-container
  interval: 24h0m0s

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: learn-helm
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: learn-helm
  policy:
    semver:
      range: 0.x.x

